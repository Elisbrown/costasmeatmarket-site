# Rebuilds the site every Monday morning (Florida time) so the home pages and blog indexes rotate
# their featured articles, and sitemap.xml, robots.txt, llms.txt and the RSS feeds carry the new
# date. Articles keep the date their content really last changed, which keeps search engines
# trusting the sitemap. Runs the SEO test suite before committing.
name: Weekly content refresh

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC = 5:17 AM Eastern (daylight time)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site (full history, for each article's real last-changed date)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install image library (same version that made the committed images)
        run: pip install pillow==12.3.0

      - name: Rebuild the site
        run: COSTAS_BUILD_DATE="$(TZ=America/New_York date +%F)" python3 _build/build.py

      - name: Run the SEO and tracking tests
        run: python3 -B -m unittest test_seo_and_discovery

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed this week."
            exit 0
          fi
          git commit -m "Weekly refresh: rotate featured articles and update sitemap dates"
          git push
